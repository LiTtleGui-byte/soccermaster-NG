SUPER_CONFIG_PATH: ./configs/default.yaml

AUG_RESIZE_SCALES: [512]
AUG_MAX_SIZE: 512
AUG_RANDOM_RESIZE: [512]

BACKBONE_TYPE: video
SIGLIP_BACKBONE_TYPE: unisoccer
DETECTION_DATA_TYPE: video
CKPT_PATH: ./pretrained_models/google/siglip2-base-patch16-512
TEXT_ENCODER_CKPT_PATH: ./pretrained_models/google/siglip2-base-patch16-512
FREEZE_VISION_ENCODER: False
FREEZE_TEXT_ENCODER: True
LOAD_CHECKPOINTS: True
STAGE_1_CKPT_DIR: ./pretrained_models/google/siglip2-base-patch16-512
LR_WARMUP_EPOCHS: 1
LOAD_HEADS: False

LINES_HEAD_TYPE: default

WEIGHT_DECAY: 1.0e-4
LR_BACKBONE: 2.5e-5
LR_BACKBONE_TEMPORAL: 5.0e-5
LR_TEXT_ENCODER: 2.5e-5
LR_SOCCERNET_GSR_DETECTION: 2.5e-5
LR_LINES_DETECTION: 5.0e-4
LR_KEYPOINTS_DETECTION: 5.0e-5
LR_CAMERA_REGRESSION: 5.0e-5
LR_VIDEO_CAPTION: 5.0e-5
LR_CAPTION_CLASSIFICATION: 5.0e-5
LR_CAPTION_CLASSIFICATION_CLASSIFIER: 1.0e-4
EXCLUDE_TEMPORAL_EMBEDDING_WEIGHT_DECAY: True
BACKBONE_USE_TEMPORAL_GATE: True

EPOCHS: 15
SCHEDULER_MILESTONES: [5, 10]
SAVE_CHECKPOINT_PER_EPOCH: 1

# 4 cards
PREFETCH_FACTOR: 4
VIDEO_CAPTION_BATCH_SIZE: 2
VIDEO_CAPTION_NUM_WORKERS: 16
NUM_FRAMES: 30
DATASETS_TO_HEADS:
  VideoCaption: [CaptionClassification]

VIDEO_CAPTION_SIGLIP_LOSS_WEIGHT: 4.0
VIDEO_CAPTION_DATASETS: ['SoccerReplay-1988', 'MatchTime', 'SoccerNet-v2']

CAPTION_CLASSIFICATION_LOSS_WEIGHT: 8.0

AUG_ENABLE_TRAINING_AUGMENTATION: True

RESUME_TRAINING: False