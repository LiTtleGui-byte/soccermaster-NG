SUPER_CONFIG_PATH:          # super (father) config path

# Seed:
SEED: 42

# System Settings:
NUM_WORKERS: 32
DEVICE: cuda

# Outputs settings:
OUTPUTS_DIR:                 # outputs directory
USE_WANDB: False             # use wandb or not
USE_TENSORBOARD: True        # use tensorboard logging
TENSORBOARD_LOG_DIR:         # tensorboard log directory (if None, will use OUTPUTS_DIR/logs)
TENSORBOARD_FLUSH_SECS: 30   # how often to flush tensorboard logs
LOG_PARAMS_GRADS: False      # whether to log parameter and gradient statistics
EXP_OWNER: 1020134037-shanghai-jiao-tong-university
EXP_PROJECT: SoccerVisualBackbone
EXP_GROUP: SoccerVisualBackbone
EXP_NAME: Default
EVAL_PER_EPOCH: 1
SAVE_CHECKPOINT_PER_EPOCH: 5
MULTI_LAST_CHECKPOINTS: 0

# Training strategies:
USE_GRADIENT_CHECKPOINTING: False
BATCH_SIZE: 12
PREFETCH_FACTOR: 6
LR: 1.0e-4
# Different learning rates for different components:
LR_BACKBONE: 1.0e-4
LR_SOCCERNET_GSR_REID: 1.0e-3
LR_SOCCERNET_GSR_DETECTION: 1.0e-3
LR_LINES_DETECTION: 5.0e-3
# LR_BACKBONE_NAMES: [backbone.0]
# LR_BACKBONE_SCALE: 0.1
# LR_LINEAR_PROJ_NAMES: [reference_points, sampling_offsets]
# LR_LINEAR_PROJ_SCALE: 0.05
# LR_DICTIONARY_NAMES: [word_to_embed, embed_to_word]
# LR_DICTIONARY_SCALE: 1.0
LR_WARMUP_EPOCHS: 1
WEIGHT_DECAY: 0.0005
MAX_CLIP_NORM: 0.1
EPOCHS: 20
ACCUMULATE_STEPS: 1
USE_ACCELERATE_CLIP_NORM: True
LOGGING_INTERVAL: 20
SCHEDULER_MILESTONES: [7, 9]  # learning rate decay milestones
SCHEDULER_GAMMA: 0.1          # learning rate decay factor

# Dataset settings:
DATA_ROOT: ./datasets/
# TASKS: [SoccerNetGSR_ReID, SoccerNetGSR_Detection, VideoCaption]
# DATASETS: [SoccerNetGSR_ReID, SoccerNetGSR_Detection, VideoCaption]
DATASETS_TO_HEADS:
  SoccerNetGSR_ReID: [SoccerNetGSR_ReID]
  SoccerNetGSR_Detection: [SoccerNetGSR_Detection, LinesDetection]
  # VideoCaption: [VideoCaption]

DATASET_SPLITS: train

SoccerNetGSR_SUB_DIR: SN-GSR-2024
SoccerNetGSR_DATA_SPLITS: train

# Data augmentation settings:
# 1. image sizes:
AUG_RESIZE_SCALES: [512]
KEEP_ASPECT_RATIO: False
AUG_MAX_SIZE: 512
AUG_RANDOM_RESIZE: [512]
# 2. random shift:
AUG_MAX_SHIFT_RATIO: 0.06
# 3. bounding box overflow:
AUG_OVERFLOW_BBOX: False
# 4. color jitter:
AUG_BRIGHTNESS: 0.4
AUG_CONTRAST: 0.4
AUG_SATURATION: 0.4
AUG_HUE: 0.2
AUG_COLOR_JITTER_V2: False
# 5. for id biding:
AUG_NUM_GROUPS: 6
AUG_TRAJECTORY_OCCLUSION_PROB: 0.5
AUG_TRAJECTORY_SWITCH_PROB: 0.5
# 6. mean and std:
# imagenet
# AUG_MEAN = [0.485, 0.456, 0.406]
# AUG_STD = [0.229, 0.224, 0.225]
# siglip
AUG_MEAN: [0.5, 0.5, 0.5]
AUG_STD: [0.5, 0.5, 0.5]

# BACKBONE:
BACKBONE_TYPE: image
NUM_FRAMES: 8
CKPT_PATH: ./pretrained_models/google/siglip2-base-patch16-512
TEXT_ENCODER_CKPT_PATH: ./pretrained_models/google/siglip2-base-patch16-512
TRAIN_BACKBONE: True

# DETR HEAD:
NUM_CLASSES: 1 # person
DILATION: False
DETR_NUM_QUERIES: 300
DETR_NUM_FEATURE_LEVELS: 1
DETR_AUX_LOSS: True
DETR_WITH_BOX_REFINE: True
DETR_TWO_STAGE: False
DETR_HIDDEN_DIM: 256
DETR_MASKS: False
DETR_POSITION_EMBEDDING: sine
DETR_NUM_HEADS: 1
DETR_ENC_LAYERS: 0
DETR_DEC_LAYERS: 1
DETR_DIM_FEEDFORWARD: 1024
DETR_DROPOUT: 0.0
DETR_DEC_N_POINTS: 4
DETR_ENC_N_POINTS: 4
DETR_CLS_LOSS_COEF: 2.0
DETR_BBOX_LOSS_COEF: 5.0
DETR_GIOU_LOSS_COEF: 2.0
DETR_ROLE_LOSS_COEF: 2.0
DETR_JN_LOSS_COEF: 1.0
DETR_DIGIT_HEAD_LOSS_COEF: 1.0
DETR_DIGIT_TAIL_LOSS_COEF: 1.0
DETR_FOCAL_ALPHA: 0.25
DETR_SET_COST_CLASS: 2.0
DETR_SET_COST_BBOX: 5.0
DETR_SET_COST_GIOU: 2.0
GSR_CAMERA_T_LOSS_WEIGHT: 1.0
GSR_CAMERA_R_LOSS_WEIGHT: 5.0
GSR_CAMERA_FL_LOSS_WEIGHT: 1.0
GSR_KEYPOINTS_LOSS_WEIGHT: 1.0
GSR_LINES_LOSS_WEIGHT: 1.0
DETR_CRITERION_BATCH_LEN: 10
NUM_KEYPOINTS: 58
NUM_LINES: 24

# Lines Head settings:
LINES_HEAD_TYPE: dpt  # 'default' for LinesHead, 'dpt' for DPTLinesHead
DPT_SELECTED_LAYERS: [2, 5, 8, 11]  # 当使用DPT时，选择的SigLIP hidden_states层索引 (0-11)

# SoccerNetGSR_ReID settings:
SOCCER_NET_GSR_REID_OUTPUT_REID_DIM: 256
SOCCER_NET_GSR_REID_NUM_PIDS: 1343 # hack implementation
SOCCER_NET_GSR_REID_ROLE_FOCAL_LOSS_WEIGHT: 1.0
SOCCER_NET_GSR_REID_PID_FOCAL_LOSS_WEIGHT: 0.1
SOCCER_NET_GSR_REID_PID_TRIPLET_LOSS_WEIGHT: 1.0
SOCCER_NET_GSR_REID_TEAM_TRIPLET_LOSS_WEIGHT: 1.0
SOCCER_NET_GSR_REID_JN_HOISTIC_FOCAL_LOSS_WEIGHT: 1.0
SOCCER_NET_GSR_REID_DIGIT_HEAD_FOCAL_LOSS_WEIGHT: 1.0
SOCCER_NET_GSR_REID_DIGIT_TAIL_FOCAL_LOSS_WEIGHT: 1.0
SOCCER_NET_GSR_REID_MARGIN: 0.3
SOCCER_NET_GSR_REID_BATCH_SIZE: 32
SOCCER_NET_GSR_REID_NUM_INSTANCES: 4

# VideoCaption settings:
VIDEO_CAPTION_LOSS_TYPE: siglip_loss
VIDEO_CAPTION_SIGLIP_LOSS_WEIGHT: 1.0
VIDEO_CAPTION_INFONCE_LOSS_WEIGHT: 1.0
VIDEO_CAPTION_DATA_ROOT: ./datasets/VideoCaption/
VIDEO_CAPTION_BATCH_SIZE: 4
VIDEO_CAPTION_NUM_WORKERS: 4
VIDEO_CAPTION_DATASETS: ['SoccerReplay-1988']
VIDEO_CAPTION_SAMPLE: 'middle'
VIDEO_CAPTION_FIX_START: null
VIDEO_CAPTION_MAX_NUM_FRAMES: -1
VIDEO_CAPTION_TRIMMED30: False
VIDEO_CAPTION_KEYWORDS: ['corner', 'goal', 'injury', 'own goal', 'penalty', 'penalty missed', 'red card', 'second yellow card', 'substitution', 'start of game(half)', 'end of game(half)', 'yellow card', 'throw in', 'free kick', 'saved by goal-keeper', 'shot off target', 'clearance', "lead to corner", 'off-side', 'var', 'foul with no card', 'statistics and summary', 'ball possession', 'ball out of play']
VIDEO_CAPTION_TEXT_KEY: 'comments_text_anonymized'
DISTRIBUTED_GATHER: True