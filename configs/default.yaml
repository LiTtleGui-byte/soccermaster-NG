SUPER_CONFIG_PATH:          # super (father) config path

# Seed:
SEED: 42

# System Settings:
NUM_WORKERS: 2
PREFETCH_FACTOR: 6
DEVICE: cuda

# Outputs settings:
OUTPUTS_DIR:                 # outputs directory
USE_WANDB: False             # use wandb or not
USE_TENSORBOARD: True        # use tensorboard logging
TENSORBOARD_LOG_DIR:         # tensorboard log directory (if None, will use OUTPUTS_DIR/logs)
TENSORBOARD_FLUSH_SECS: 30   # how often to flush tensorboard logs
LOG_PARAMS_GRADS: False      # whether to log parameter and gradient statistics
EXP_OWNER: 1020134037-shanghai-jiao-tong-university
EXP_PROJECT: SoccerVisualBackbone
EXP_GROUP: SoccerVisualBackbone
EXP_NAME: Default
SAVE_CHECKPOINT_PER_EPOCH: 1
MULTI_LAST_CHECKPOINTS: 0

# Training strategies:
BATCH_SIZE: 8
LR: 1.0e-4
# LR_BACKBONE_NAMES: [backbone.0]
# LR_BACKBONE_SCALE: 0.1
# LR_LINEAR_PROJ_NAMES: [reference_points, sampling_offsets]
# LR_LINEAR_PROJ_SCALE: 0.05
# LR_DICTIONARY_NAMES: [word_to_embed, embed_to_word]
# LR_DICTIONARY_SCALE: 1.0
LR_WARMUP_EPOCHS: 1
WEIGHT_DECAY: 0.0005
MAX_CLIP_NORM: 0.1
EPOCHS: 20
ACCUMULATE_STEPS: 1
USE_ACCELERATE_CLIP_NORM: True
LOGGING_INTERVAL: 20
SCHEDULER_MILESTONES: [7, 9]  # learning rate decay milestones
SCHEDULER_GAMMA: 0.1          # learning rate decay factor

# Dataset settings:
DATA_ROOT: ./datasets/
TASKS: [SoccerNetGSR_Detection]
DATASETS: [SoccerNetGSR_Detection]
DATASET_SPLITS: train

SoccerNetGSR_SUB_DIR: SN-GSR-2024
SoccerNetGSR_DATA_SPLITS: train

# Data augmentation settings:
# 1. image sizes:
AUG_RESIZE_SCALES: [512]
KEEP_ASPECT_RATIO: False
AUG_MAX_SIZE: 512
AUG_RANDOM_RESIZE: [512]
# 2. random shift:
AUG_MAX_SHIFT_RATIO: 0.06
# 3. bounding box overflow:
AUG_OVERFLOW_BBOX: False
# 4. color jitter:
AUG_BRIGHTNESS: 0.4
AUG_CONTRAST: 0.4
AUG_SATURATION: 0.4
AUG_HUE: 0.2
AUG_COLOR_JITTER_V2: False
# 5. for id biding:
AUG_NUM_GROUPS: 6
AUG_TRAJECTORY_OCCLUSION_PROB: 0.5
AUG_TRAJECTORY_SWITCH_PROB: 0.5
# 6. mean and std:
# imagenet
# AUG_MEAN = [0.485, 0.456, 0.406]
# AUG_STD = [0.229, 0.224, 0.225]
# siglip
AUG_MEAN: [0.5, 0.5, 0.5]
AUG_STD: [0.5, 0.5, 0.5]

# BACKBONE:
CKPT_PATH: ./pretrained_models/google/siglip2-base-patch16-512
TRAIN_BACKBONE: True

# DETR HEAD:
NUM_CLASSES: 1 # person
DILATION: False
DETR_NUM_QUERIES: 300
DETR_NUM_FEATURE_LEVELS: 1
DETR_AUX_LOSS: True
DETR_WITH_BOX_REFINE: True
DETR_TWO_STAGE: False
DETR_HIDDEN_DIM: 256
DETR_MASKS: False
DETR_POSITION_EMBEDDING: sine
DETR_NUM_HEADS: 1
DETR_ENC_LAYERS: 0
DETR_DEC_LAYERS: 1
DETR_DIM_FEEDFORWARD: 1024
DETR_DROPOUT: 0.0
DETR_DEC_N_POINTS: 4
DETR_ENC_N_POINTS: 4
DETR_CLS_LOSS_COEF: 2.0
DETR_BBOX_LOSS_COEF: 5.0
DETR_GIOU_LOSS_COEF: 2.0
DETR_FOCAL_ALPHA: 0.25
DETR_SET_COST_CLASS: 2.0
DETR_SET_COST_BBOX: 5.0
DETR_SET_COST_GIOU: 2.0
DETR_CRITERION_BATCH_LEN: 5