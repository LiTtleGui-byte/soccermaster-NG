SUPER_CONFIG_PATH: ./configs/default.yaml

AUG_RESIZE_SCALES: [224]
AUG_MAX_SIZE: 224
AUG_RANDOM_RESIZE: [224]

BACKBONE_TYPE: video
SIGLIP_BACKBONE_TYPE: unisoccer_part_temporal
TEMPORAL_START_LAYER: 8
DETR_LOCAL_FEATURES_TYPE: early
LINES_LOCAL_FEATURES_TYPE: early
KEYPOINTS_LOCAL_FEATURES_TYPE: early
DETECTION_DATA_TYPE: video
CKPT_PATH: ./pretrained_models/google/siglip2-base-patch16-224
TEXT_ENCODER_CKPT_PATH: ./pretrained_models/google/siglip2-base-patch16-224
FREEZE_TEXT_ENCODER: True
LOAD_CHECKPOINTS: False
STAGE_1_CKPT_DIR: ./pretrained_models/google/siglip2-base-patch16-224
LR_WARMUP_EPOCHS: 1
EPOCHS: 20
SCHEDULER_TYPE: CosineAnnealingLR

LINES_HEAD_TYPE: default

WEIGHT_DECAY: 1.0e-4
LR_BACKBONE: 2.5e-5
LR_BACKBONE_TEMPORAL: 5.0e-5
LR_TEXT_ENCODER: 2.5e-5
LR_SOCCERNET_GSR_DETECTION: 2.5e-5
LR_LINES_DETECTION: 5.0e-4
LR_KEYPOINTS_DETECTION: 5.0e-5
LR_CAMERA_REGRESSION: 5.0e-5
LR_VIDEO_CAPTION: 5.0e-5
LR_CAPTION_CLASSIFICATION: 5.0e-5
LR_CAPTION_CLASSIFICATION_CLASSIFIER: 1.0e-4
EXCLUDE_TEMPORAL_EMBEDDING_WEIGHT_DECAY: True
BACKBONE_USE_TEMPORAL_GATE: True

SAVE_CHECKPOINT_PER_EPOCH: 1

# 8 cards
PREFETCH_FACTOR: 2
BATCH_SIZE: 2
NUM_WORKERS: 6
VIDEO_CAPTION_BATCH_SIZE: 12
VIDEO_CAPTION_NUM_WORKERS: 8
NUM_FRAMES: 30
DATASETS_TO_HEADS:
  SoccerNetGSR_Detection: [KeypointsDetection]

VIDEO_CAPTION_SIGLIP_LOSS_WEIGHT: 4.0
VIDEO_CAPTION_DATASETS: ['SoccerReplay-1988', 'MatchTime', 'SoccerNet-v2']

CAPTION_CLASSIFICATION_LOSS_WEIGHT: 1.0

AUG_ENABLE_TRAINING_AUGMENTATION: True

USE_EXTRA_DATA: True
EXTRA_DATA_PATH: ./datasets/SN-GSR-2024/SoccerNetGS/extracted_info.pkl
EXTRA_DATA_ONLY: False
USE_EXTRA_DATA_AMOUNT: 7000

RESUME_TRAINING: False