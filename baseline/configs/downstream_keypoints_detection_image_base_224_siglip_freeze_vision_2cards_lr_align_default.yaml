SUPER_CONFIG_PATH: ./configs/default.yaml

AUG_RESIZE_SCALES: [224]
AUG_MAX_SIZE: 224
AUG_RANDOM_RESIZE: [224]

BACKBONE_TYPE: image
SIGLIP_BACKBONE_TYPE: pure_siglip
DETECTION_DATA_TYPE: image
CKPT_PATH: ./pretrained_models/google/siglip2-base-patch16-224
TEXT_ENCODER_CKPT_PATH: ./pretrained_models/google/siglip2-base-patch16-224
FREEZE_VISION_ENCODER: True
FREEZE_TEXT_ENCODER: True
LOAD_CHECKPOINTS: False
STAGE_1_CKPT_DIR: ./pretrained_models/google/siglip2-base-patch16-224
LR_WARMUP_EPOCHS: 1
BACKBONE_HIDDEN_DIM: 768
EPOCHS: 20
SCHEDULER_TYPE: CosineAnnealingLR

LINES_HEAD_TYPE: default

WEIGHT_DECAY: 1.0e-4
LR_BACKBONE: 1.0e-4
LR_LINES_DETECTION: 1.0e-2
LR_KEYPOINTS_DETECTION: 1.0e-3
EXCLUDE_TEMPORAL_EMBEDDING_WEIGHT_DECAY: True
BACKBONE_USE_TEMPORAL_GATE: True

EVAL_PER_EPOCH: 1
SAVE_CHECKPOINT_PER_EPOCH: 5

# 2 cards
PREFETCH_FACTOR: 2
BATCH_SIZE: 24
NUM_WORKERS: 12
VIDEO_CAPTION_BATCH_SIZE: 2
VIDEO_CAPTION_TEST_BATCH_SIZE: 3
VIDEO_CAPTION_NUM_WORKERS: 16
NUM_FRAMES: 30
DATASETS_TO_HEADS:
  SoccerNetGSR_Detection: [KeypointsDetection]

VIDEO_CAPTION_DATASETS: ['SoccerReplay-1988', 'MatchTime', 'SoccerNet-v2']

AUG_ENABLE_TRAINING_AUGMENTATION: True

USE_EXTRA_DATA: False
EXTRA_DATA_PATH: ./datasets/SN-GSR-2024/SoccerNetGS/extracted_info.pkl
EXTRA_DATA_ONLY: False
USE_EXTRA_DATA_AMOUNT: 7000

RESUME_TRAINING: False