# SoccerTrackerTransformer Configuration

# Import base configuration
imports:
  - base.yaml

# Override specific values
experiment_name: "debug"

model:
  type: SoccerTrackerTransformerAAFormer
  zero_init_for_residual: false

data:
  dataset_type: "SoccerSequenceDataset"  # Just override the dataset type
  train_split: "train+valid"
  val_split: "test"
  max_clip_frames: 100
  flip_x_prob: 0.5
  flip_y_prob: 0.5
  use_all_frames_as_start: true

training:
  num_workers: 4

  # Only specify the tasks that differ from base.yaml
  tasks:
    track: false
    role: true
    team: false
    jersey: false
    coord: false
    missing: false 