# SoccerTrackerTransformer Configuration

# Import base configuration
imports:
  - base.yaml

# Override specific values
experiment_name: "debug_timesformer_track_only_random_track_aug_0.05"

model:
  type: SoccerTrackerTransformerTimeSformer
  max_affinity_frame_distance: 25  # More restrictive for large clip size (100 frames)

data:
  dataset_type: "SoccerSequenceDataset"  # Just override the dataset type
  precompute_track_masks: false
  random_augment_track_ids: true
  random_track_id_change_prob: 0.05
  
training:
  batch_size: 1
  num_workers: 8
  log_interval: 1
  eval_interval: 500

  # Only specify the tasks that differ from base.yaml
  tasks:
    track: true
    role: false
    team: false
    jersey: false
    coord: false
    missing: false 