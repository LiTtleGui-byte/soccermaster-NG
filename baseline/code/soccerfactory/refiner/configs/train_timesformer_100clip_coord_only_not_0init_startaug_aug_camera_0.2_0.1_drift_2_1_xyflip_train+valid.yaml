# SoccerTrackerTransformer Configuration

# Import base configuration
imports:
  - base.yaml

# Override specific values
experiment_name: "train_timesformer_100clip_coord_only_not_0init_startaug_aug_camera_0.2_0.1_drift_2_1_xyflip_train+valid"

model:
  type: SoccerTrackerTransformerTimeSformer
  zero_init_for_residual: false

data:
  dataset_type: "SoccerSequenceCachedDataset"  # Just override the dataset type
  train_split: "train+valid"
  val_split: "test"
  augment_coords: true
  augment_coords_mode: "camera+drift"
  rotation_std: 0.2  # Increased rotation noise
  translation_std: 0.1  # Increased translation noise
  camera_drift_prob: 0.03  # Probability of applying drift per frame
  drift_rotation_std: 2.0  # Standard deviation for rotation in drift mode
  drift_translation_std: 1.0  # Standard deviation for translation in drift mode
  max_clip_frames: 100
  flip_x_prob: 0.5
  flip_y_prob: 0.5
  use_all_frames_as_start: true

training:
  num_workers: 4

  # Only specify the tasks that differ from base.yaml
  tasks:
    track: false
    role: false
    team: false
    jersey: false
    coord: true
    missing: false 