SUPER_CONFIG_PATH: ./configs/default.yaml

AUG_RESIZE_SCALES: [224]
AUG_MAX_SIZE: 224
AUG_RANDOM_RESIZE: [224]

BACKBONE_TYPE: video
SIGLIP_BACKBONE_TYPE: unisoccer
DETECTION_DATA_TYPE: video
CKPT_PATH: ./pretrained_models/google/siglip2-base-patch16-224
TEXT_ENCODER_CKPT_PATH: ./pretrained_models/google/siglip2-base-patch16-224
FREEZE_TEXT_ENCODER: True
LOAD_CHECKPOINTS: False
STAGE_1_CKPT_DIR: ./pretrained_models/google/siglip2-base-patch16-224
LR_WARMUP_EPOCHS: 1
EPOCHS: 20
SCHEDULER_TYPE: CosineAnnealingLR

LINES_HEAD_TYPE: default

WEIGHT_DECAY: 1.0e-4
LR_BACKBONE: 5.0e-5
LR_BACKBONE_TEMPORAL: 1.0e-4
LR_TEXT_ENCODER: 5.0e-5
LR_SOCCERNET_GSR_DETECTION: 5.0e-5
LR_LINES_DETECTION: 1.0e-3
LR_KEYPOINTS_DETECTION: 1.0e-4
LR_CAMERA_REGRESSION: 1.0e-4
LR_VIDEO_CAPTION: 1.0e-4
LR_CAPTION_CLASSIFICATION: 1.0e-4
LR_CAPTION_CLASSIFICATION_CLASSIFIER: 2.0e-4
EXCLUDE_TEMPORAL_EMBEDDING_WEIGHT_DECAY: True
BACKBONE_USE_TEMPORAL_GATE: True

SAVE_CHECKPOINT_PER_EPOCH: 1

# 4 cards
PREFETCH_FACTOR: 2
BATCH_SIZE: 4
NUM_WORKERS: 8
VIDEO_CAPTION_BATCH_SIZE: 4
VIDEO_CAPTION_NUM_WORKERS: 8
NUM_FRAMES: 30
DATASETS_TO_HEADS:
  SoccerNetGSR_Detection: [SoccerNetGSR_Detection, LinesDetection, KeypointsDetection]
  VideoCaption: [VideoCaption, CaptionClassification]

VIDEO_CAPTION_SIGLIP_LOSS_WEIGHT: 4.0
VIDEO_CAPTION_DATASETS: ['SoccerReplay-1988', 'MatchTime', 'SoccerNet-v2']

CAPTION_CLASSIFICATION_LOSS_WEIGHT: 1.0

AUG_ENABLE_TRAINING_AUGMENTATION: True

RESUME_TRAINING: False