SUPER_CONFIG_PATH: ./configs/default.yaml

AUG_RESIZE_SCALES: [512]
AUG_MAX_SIZE: 512
AUG_RANDOM_RESIZE: [512]

BACKBONE_TYPE: video
SIGLIP_BACKBONE_TYPE: unisoccer_part_temporal
TEMPORAL_START_LAYER: 16
DETR_LOCAL_FEATURES_TYPE: early
LINES_LOCAL_FEATURES_TYPE: early
KEYPOINTS_LOCAL_FEATURES_TYPE: early
DETECTION_DATA_TYPE: video
CKPT_PATH: ./pretrained_models/google/siglip2-large-patch16-512
TEXT_ENCODER_CKPT_PATH: ./pretrained_models/google/siglip2-large-patch16-512
FREEZE_TEXT_ENCODER: True
LOAD_CHECKPOINTS: False
STAGE_1_CKPT_DIR: ./pretrained_models/google/siglip2-large-patch16-512
LR_WARMUP_EPOCHS: 1
BACKBONE_HIDDEN_DIM: 1024
EPOCHS: 40
SCHEDULER_TYPE: CosineAnnealingLR

LINES_HEAD_TYPE: default

WEIGHT_DECAY: 1.0e-4
LR_BACKBONE: 1.0e-4
LR_BACKBONE_TEMPORAL: 2.0e-4
LR_TEXT_ENCODER: 1.0e-4
LR_SOCCERNET_GSR_DETECTION: 2.0e-4
LR_LINES_DETECTION: 2.0e-3
LR_KEYPOINTS_DETECTION: 2.0e-4
LR_CAMERA_REGRESSION: 2.0e-4
LR_VIDEO_CAPTION: 2.0e-4
LR_CAPTION_CLASSIFICATION: 2.0e-4
LR_CAPTION_CLASSIFICATION_CLASSIFIER: 4.0e-4
EXCLUDE_TEMPORAL_EMBEDDING_WEIGHT_DECAY: True
BACKBONE_USE_TEMPORAL_GATE: True

SAVE_CHECKPOINT_PER_EPOCH: 1

# 16 cards
BATCH_SIZE: 2
NUM_WORKERS: 22
VIDEO_CAPTION_BATCH_SIZE: 2
VIDEO_CAPTION_TEST_BATCH_SIZE: 3
VIDEO_CAPTION_NUM_WORKERS: 16
NUM_FRAMES: 30
DATASETS_TO_HEADS:
  SoccerNetGSR_Detection: [SoccerNetGSR_Detection]

VIDEO_CAPTION_SIGLIP_LOSS_WEIGHT: 4.0
VIDEO_CAPTION_DATASETS: ['SoccerReplay-1988', 'MatchTime', 'SoccerNet-v2']

CAPTION_CLASSIFICATION_LOSS_WEIGHT: 1.0

AUG_ENABLE_TRAINING_AUGMENTATION: True

USE_EXTRA_DATA: True
EXTRA_DATA_PATH: ./datasets/SN-GSR-2024/SoccerNetGS/extracted_info.pkl
EXTRA_DATA_ONLY: False
USE_EXTRA_DATA_AMOUNT: 7000

RESUME_TRAINING: False