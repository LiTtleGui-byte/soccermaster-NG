SUPER_CONFIG_PATH: ./configs/default.yaml

AUG_RESIZE_SCALES: [256]
AUG_MAX_SIZE: 256
AUG_RANDOM_RESIZE: [256]

BACKBONE_TYPE: video
SIGLIP_BACKBONE_TYPE: unisoccer
DETECTION_DATA_TYPE: video
CKPT_PATH: ./pretrained_models/google/siglip2-large-patch16-256
TEXT_ENCODER_CKPT_PATH: ./pretrained_models/google/siglip2-large-patch16-256
BACKBONE_HIDDEN_DIM: 1024
FREEZE_TEXT_ENCODER: False
LOAD_CHECKPOINTS: True
STAGE_1_CKPT_DIR: ./outputs/image_large_256_wo_reid/epoch_14
RESUME_TRAINING: False

LINES_HEAD_TYPE: default

WEIGHT_DECAY: 1.0e-4
LR_BACKBONE: 5.0e-5
LR_BACKBONE_TEMPORAL: 1.0e-4
LR_TEXT_ENCODER: 5.0e-5
LR_SOCCERNET_GSR_DETECTION: 5.0e-5
LR_LINES_DETECTION: 5.0e-4
LR_KEYPOINTS_DETECTION: 5.0e-5
LR_CAMERA_REGRESSION: 5.0e-5
LR_VIDEO_CAPTION: 5.0e-5
LR_CAPTION_CLASSIFICATION: 1.66e-5
LR_CAPTION_CLASSIFICATION_CLASSIFIER: 3.33e-5
EXCLUDE_TEMPORAL_EMBEDDING_WEIGHT_DECAY: True
BACKBONE_USE_TEMPORAL_GATE: True

SAVE_CHECKPOINT_PER_EPOCH: 1

BATCH_SIZE: 1
NUM_WORKERS: 4
VIDEO_CAPTION_BATCH_SIZE: 2
VIDEO_CAPTION_NUM_WORKERS: 8
NUM_FRAMES: 30
DATASETS_TO_HEADS:
  SoccerNetGSR_Detection: [SoccerNetGSR_Detection, LinesDetection, KeypointsDetection, CameraRegression]
  VideoCaption: [VideoCaption, CaptionClassification]

VIDEO_CAPTION_SIGLIP_LOSS_WEIGHT: 4.0
VIDEO_CAPTION_DATASETS: ['SoccerReplay-1988', 'MatchTime', 'SoccerNet-v2']

CAPTION_CLASSIFICATION_LOSS_WEIGHT: 8.0
CAPTION_CLASSIFICATION_USE_TRANSFORMERS: True
CAPTION_CLASSIFICATION_NUM_TRANSFORMER_ENCODER: 2
CAPTION_CLASSIFICATION_USE_ATTN_POOL: False
CAPTION_CLASSIFICATION_USE_LAYER_NORM: True
CAPTION_CLASSIFICATION_USE_MLP: False
CAPTION_CLASSIFICATION_DROPOUT_RATE: 0.0
