SUPER_CONFIG_PATH: ./configs/default.yaml

AUG_RESIZE_SCALES: [512]
AUG_MAX_SIZE: 512
AUG_RANDOM_RESIZE: [512]

BACKBONE_TYPE: image
SIGLIP_BACKBONE_TYPE: pure_siglip
DETECTION_DATA_TYPE: image
CKPT_PATH: ./pretrained_models/google/siglip2-base-patch16-512
TEXT_ENCODER_CKPT_PATH: ./pretrained_models/google/siglip2-base-patch16-512
FREEZE_VISION_ENCODER: False
FREEZE_TEXT_ENCODER: True
LOAD_CHECKPOINTS: True
STAGE_1_CKPT_DIR: ./pretrained_models/google/siglip2-base-patch16-512
LR_WARMUP_EPOCHS: 1
LOAD_HEADS: False

LINES_HEAD_TYPE: default

WEIGHT_DECAY: 1.0e-4
LR_BACKBONE: 5.0e-5
LR_BACKBONE_TEMPORAL: 1.0e-4
LR_TEXT_ENCODER: 5.0e-5
LR_SOCCERNET_GSR_DETECTION: 5.0e-5
LR_LINES_DETECTION: 1.0e-3
LR_KEYPOINTS_DETECTION: 1.0e-4
LR_CAMERA_REGRESSION: 1.0e-4
LR_VIDEO_CAPTION: 1.0e-4
LR_CAPTION_CLASSIFICATION: 1.0e-4
LR_CAPTION_CLASSIFICATION_CLASSIFIER: 2.0e-4
EXCLUDE_TEMPORAL_EMBEDDING_WEIGHT_DECAY: True
BACKBONE_USE_TEMPORAL_GATE: True

EPOCHS: 450
SCHEDULER_MILESTONES: [150, 300]
EVAL_PER_EPOCH: 30
SAVE_CHECKPOINT_PER_EPOCH: 30

# 4 cards
BATCH_SIZE: 60
NUM_WORKERS: 24
VIDEO_CAPTION_BATCH_SIZE: 24
VIDEO_CAPTION_NUM_WORKERS: 32
NUM_FRAMES: 30
DATASETS_TO_HEADS:
  SoccerNetGSR_Detection: [SoccerNetGSR_Detection]

VIDEO_CAPTION_SIGLIP_LOSS_WEIGHT: 4.0
VIDEO_CAPTION_DATASETS: ['SoccerReplay-1988', 'MatchTime', 'SoccerNet-v2']

CAPTION_CLASSIFICATION_LOSS_WEIGHT: 8.0
CAPTION_CLASSIFICATION_USE_TRANSFORMERS: True
CAPTION_CLASSIFICATION_NUM_TRANSFORMER_ENCODER: 2
CAPTION_CLASSIFICATION_USE_ATTN_POOL: False
CAPTION_CLASSIFICATION_USE_LAYER_NORM: True
CAPTION_CLASSIFICATION_USE_MLP: False
CAPTION_CLASSIFICATION_DROPOUT_RATE: 0.0

DETR_ENC_LAYERS: 6
DETR_DEC_LAYERS: 6
DETR_ENABLE_ROLE_CLASSIFICATION: True
DETR_ENABLE_JN_CLASSIFICATION: True

AUG_ENABLE_TRAINING_AUGMENTATION: True
AUG_COLOR_JITTER_V2: True
AUG_RANDOM_HORIZONTAL_FLIP: True
AUG_GAUSSIAN_NOISE: True
AUG_GAUSSIAN_BLUR: True
AUG_ENABLE_RANDOM_CROP: True
AUG_ENABLE_RANDOM_AFFINE: True
AUG_ENABLE_RANDOM_PERSPECTIVE: True

RESUME_TRAINING: True