SUPER_CONFIG_PATH: ./configs/default.yaml

AUG_RESIZE_SCALES: [256]
AUG_MAX_SIZE: 256
AUG_RANDOM_RESIZE: [256]

BACKBONE_TYPE: image
SIGLIP_BACKBONE_TYPE: pure_dino
AUG_MEAN: [0.485, 0.456, 0.406]
AUG_STD: [0.229, 0.224, 0.225]
DETECTION_DATA_TYPE: image
CKPT_PATH: ./pretrained_models/dinov3/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
TEXT_ENCODER_CKPT_PATH: ./pretrained_models/google/siglip2-large-patch16-256
FREEZE_VISION_ENCODER: True
FREEZE_TEXT_ENCODER: True
LOAD_CHECKPOINTS: False
STAGE_1_CKPT_DIR: ./pretrained_models/dinov3/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
LR_WARMUP_EPOCHS: 1
BACKBONE_HIDDEN_DIM: 768
EPOCHS: 20
SCHEDULER_TYPE: CosineAnnealingLR

LINES_HEAD_TYPE: default

WEIGHT_DECAY: 1.0e-4
LR_SOCCERNET_GSR_DETECTION: 5.0e-5
LR_LINES_DETECTION: 1.0e-2
LR_KEYPOINTS_DETECTION: 1.0e-3
EXCLUDE_TEMPORAL_EMBEDDING_WEIGHT_DECAY: True
BACKBONE_USE_TEMPORAL_GATE: True

SAVE_CHECKPOINT_PER_EPOCH: 1

# 8 cards
BATCH_SIZE: 30
NUM_WORKERS: 16
VIDEO_CAPTION_BATCH_SIZE: 2
VIDEO_CAPTION_TEST_BATCH_SIZE: 3
VIDEO_CAPTION_NUM_WORKERS: 16
NUM_FRAMES: 30
DATASETS_TO_HEADS:
  SoccerNetGSR_Detection: [SoccerNetGSR_Detection, LinesDetection, KeypointsDetection]

VIDEO_CAPTION_SIGLIP_LOSS_WEIGHT: 4.0
VIDEO_CAPTION_DATASETS: ['SoccerReplay-1988', 'MatchTime', 'SoccerNet-v2']

CAPTION_CLASSIFICATION_LOSS_WEIGHT: 1.0

AUG_ENABLE_TRAINING_AUGMENTATION: True

USE_EXTRA_DATA: False
EXTRA_DATA_PATH: ./datasets/SN-GSR-2024/SoccerNetGS/extracted_info.pkl
EXTRA_DATA_ONLY: False
USE_EXTRA_DATA_AMOUNT: 7000

RESUME_TRAINING: True